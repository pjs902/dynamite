# BayesOptGenerator — q-stars and ml free (2D), others fixed.
# Used in dummy mode for triaxiality physical validity testing.
# With only q-stars (not p, u) free, the triaxiality BoTorch constraints
# are not active, but _free_qpu_idx['q'] will be populated (exercises the fix).
---
system_attributes:
    distMPc: 39.96
    name: "NGC6278"

system_components:

    bh:
        parameters:
            m:
                par_generator_settings:
                    lo: 1.0
                    hi: 10.0
                    step: 1.
                    minstep: 0.
                fixed: True
                value: 5.0
                logarithmic: True
                LaTeX: "$\\log(M_\\mathrm{BH}/M_\\odot)$"
            a:
                fixed: True
                value: 1.e-3
                LaTeX: "$a_\\mathrm{BH}$"
        type: "Plummer"
        contributes_to_potential: True
        include: True

    dh:
        parameters:
            c:
                par_generator_settings:
                    lo: 2.0
                    hi: 4.0
                    step: 1.0
                    minstep: 0.1
                logarithmic: True
                fixed: True
                value: 3.0
                LaTeX: "$\\log(C)$"
            f:
                par_generator_settings:
                    lo: 0.0
                    hi: 2.0
                    step: 0.5
                    minstep: 0.1
                logarithmic: True
                fixed: True
                value: 1.0
                LaTeX: "$\\log(M_{200}/M_\\mathrm{stars})$"
        type: NFW
        contributes_to_potential: True
        include: True

    stars:
        parameters:
            q:
                par_generator_settings:
                    lo: 0.05
                    hi: 0.99
                    step: 0.04
                    minstep: 0.02
                fixed: False          # FREE — exercises _free_qpu_idx name matching
                value: 0.54
                LaTeX: "$q_\\mathrm{min}$"
            p:
                par_generator_settings:
                    lo: 0.99
                    hi: 0.999
                    step: 0.02
                    minstep: 0.01
                fixed: True
                value: 0.99
                LaTeX: "$p_\\mathrm{min}$"
            u:
                par_generator_settings:
                    lo: 0.95
                    hi: 1.0
                    step: 0.01
                    minstep: 0.01
                fixed: True
                value: 0.9999
                LaTeX: "$u_\\mathrm{min}$"
        type: "TriaxialVisibleComponent"
        contributes_to_potential: False
        mge_pot: "mge.ecsv"
        mge_lum: "mge.ecsv"
        include: True
        kinematics:
            kinset1:
                type: GaussHermite
                hist_width: '2719.8215332031'
                hist_center: '0.0000'
                hist_bins: '203'
                datafile: "gauss_hermite_kins.ecsv"
                aperturefile: "aperture.dat"
                binfile: "bins.dat"
                with_pops: False

system_parameters:
    ml:
        par_generator_settings:
            lo: 1.
            hi: 9.
            step: 4.0
            minstep: 0.5
        fixed: False
        value: 5.
        LaTeX: "$Y_\\mathrm{r}$"

orblib_settings:
    nE: 2
    logrmin: -0.101275
    logrmax: 1.99123
    nI2: 4
    nI3: 3
    dithering: 1
    quad_nr: 10
    quad_nth: 6
    quad_nph: 6
    orbital_periods: 200
    sampling: 50000
    starting_orbit: 1
    number_orbits: -1
    accuracy: '1.0d-5'
    random_seed: 42

weight_solver_settings:
    type: "NNLS"
    nnls_solver: 'scipy'
    regularisation: 0
    number_GH: 4
    GH_sys_err: '0.0 0.0 0.0 0.0 0.3 0.3 0.6 0.6'
    lum_intr_rel_err: 0.01
    sb_proj_rel_err: 0.02
    reattempt_failures: True

parameter_space_settings:
    generator_type: "BayesOptGenerator"
    which_chi2: "kinchi2"
    generator_settings:
        n_initial_random: 6
        batch_size: 3
        n_orblib_configs: 3
        n_ml_per_config: 1
    stopping_criteria:
        min_delta_chi2_abs: 0.1
        n_max_mods: 25
        n_max_iter: 8

legacy_settings:
    directory: "default"

io_settings:
    input_directory: "NGC6278_input/"
    output_directory: "NGC6278_bayesopt_qml_output/"
    all_models_file: "all_models.ecsv"

multiprocessing_settings:
    ncpus: 1
    modeliterator: 'ModelInnerIterator'
    use_jax_orblib: false
    jax_n_periods: 200
    jax_n_steps: 50000
    jax_batch_size: 100
